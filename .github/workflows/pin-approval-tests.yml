name: PIN approval regression tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pin-approval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx
      - name: Check Python syntax
        run: python -m compileall -q server.py tests/test_pin_approval.py
      - name: PIN approval and checkout regression tests
        run: pytest -q tests/test_pin_approval.py
