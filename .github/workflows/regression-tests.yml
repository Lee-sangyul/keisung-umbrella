name: Keisung Umbrella regression tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install app and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest httpx
      - name: Validate Python syntax
        run: python -m compileall -q server.py tests/test_student_pin.py tests/test_rental_due.py tests/test_stocktake.py
      - name: Run regression suite
        run: pytest -q tests/test_student_pin.py tests/test_rental_due.py tests/test_stocktake.py
